
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
"$schema" = "https://yazi-rs.github.io/schemas/yazi.json"

[manager]
linemode       = "size"
mouse_events   = [ "click", "scroll" ]
ratio          = [ 1, 4, 3 ]
scrolloff      = 5
show_hidden    = true
show_symlink   = true
sort_by        = "natural"
sort_dir_first = true
sort_reverse   = false
sort_sensitive = false
sort_translit  = false
# title_format = "Yazi: {cwd}"

[preview]
cache_dir  = ""
max_height = 900
max_width  = 600
tab_size   = 2
# image_delay = 30
image_filter    = "triangle"
image_quality   = 75
sixel_fraction  = 15
ueberzug_offset = [ 0, 0, 0, 0 ]
ueberzug_scale  = 1

[opener]
edit = [
  { block = true, desc = "$EDITOR", for = "unix", run = '${EDITOR:-vi} "$@"' },
  { desc = "code", for = "windows", orphan = true, run = 'code %*' },
  { block = true, desc = "code (block)", for = "windows", run = 'code -w %*' },
]
extract = [
  { desc = "Extract here", for = "unix", run = 'ya pub extract --list "$@"' },
  { desc = "Extract here", for = "windows", run = 'ya pub extract --list %*' },
]
open = [
  { desc = "Open", for = "linux", run = 'xdg-open "$1"' },
  { desc = "Open", for = "macos", run = 'open "$@"' },
  { desc = "Open", for = "windows", orphan = true, run = 'start "" "%1"' },
]
play = [
  { for = "unix", orphan = true, run = 'mpv --force-window "$@"' },
  { for = "windows", orphan = true, run = 'mpv --force-window %*' },
  { block = true, desc = "Show media info", for = "unix", run = '''mediainfo "$1"; echo "Press enter to exit"; read _''' },
]
reveal = [
  { desc = "Reveal", for = "linux", run = 'xdg-open "$(dirname "$1")"' },
  { desc = "Reveal", for = "macos", run = 'open -R "$1"' },
  { desc = "Reveal", for = "windows", orphan = true, run = 'explorer /select,"%1"' },
  { block = true, desc = "Show EXIF", for = "unix", run = '''exiftool "$1"; echo "Press enter to exit"; read _''' },
]

[open]
rules = [
  # Folder
  { name = "*/", use = [ "edit", "open", "reveal" ] },
  # Text
  { mime = "text/*", use = [ "edit", "reveal" ] },
  # Image
  { mime = "image/*", use = [ "open", "reveal" ] },
  # Media
  { mime = "{audio,video}/*", use = [ "play", "reveal" ] },
  # Archive
  { mime = "application/{,g}zip", use = [ "extract", "reveal" ] },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "extract", "reveal" ] },
  # JSON
  { mime = "application/{json,x-ndjson}", use = [ "edit", "reveal" ] },
  { mime = "*/javascript", use = [ "edit", "reveal" ] },
  # Empty file
  { mime = "inode/x-empty", use = [ "edit", "reveal" ] },
  # Fallback
  { name = "*", use = [ "open", "reveal" ] },
]

[tasks]
bizarre_retry    = 5
image_alloc      = 536870912 # 512MB
image_bound      = [ 0, 0 ]
macro_workers    = 25
micro_workers    = 10
suppress_preload = false

[plugin]

fetchers = [
  # Mimetype
  { id = "mime", if = "!mime", name = "*", prio = "high", run = "mime" },
]
preloaders = [
  # Image
  { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/vnd.ms-opentype", run = "font" },
]
prepend_previewers = [ { mime = "text/csv", run = "miller" } ]
previewers = [
  { name = "*/", run = "folder", sync = true },
  # Code
  { mime = "text/*", run = "code" },
  { mime = "*/{xml,javascript,x-wine-extension-ini}", run = "code" },
  # JSON
  { mime = "application/{json,x-ndjson}", run = "json" },
  # Image
  { mime = "image/{avif,hei?,jxl,svg+xml}", run = "magick" },
  { mime = "image/*", run = "image" },
  # Video
  { mime = "video/*", run = "video" },
  # PDF
  { mime = "application/pdf", run = "pdf" },
  # Archive
  { mime = "application/{,g}zip", run = "archive" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar,iso9660-image}", run = "archive" },
  # Font
  { mime = "font/*", run = "font" },
  { mime = "application/vnd.ms-opentype", run = "font" },
  # Empty file
  { mime = "inode/x-empty", run = "empty" },
  # Fallback
  { name = "*", run = "file" },
]


[input]
cursor_blink = false

# cd
cd_offset = [ 0, 2, 50, 3 ]
cd_origin = "top-center"
cd_title  = "Change directory:"

# create
# create_title = "Create:"
create_offset = [ 0, 2, 50, 3 ]
create_origin = "top-center"

# rename
rename_offset = [ 0, 1, 50, 3 ]
rename_origin = "hovered"
rename_title  = "Rename:"

# filter
filter_offset = [ 0, 2, 50, 3 ]
filter_origin = "top-center"
filter_title  = "Filter:"

# find
find_offset = [ 0, 2, 50, 3 ]
find_origin = "top-center"
find_title  = [ "Find next:", "Find previous:" ]

# search
search_offset = [ 0, 2, 50, 3 ]
search_origin = "top-center"
search_title  = "Search via {n}:"

# shell
shell_offset = [ 0, 2, 50, 3 ]
shell_origin = "top-center"
shell_title  = [ "Shell:", "Shell (block):" ]

[confirm]

# trash
trash_offset = [ 0, 0, 70, 20 ]
trash_origin = "center"
trash_title  = "Trash {n} selected file{s}?"

# delete
delete_offset = [ 0, 0, 70, 20 ]
delete_origin = "center"
delete_title  = "Permanently delete {n} selected file{s}?"

# overwrite
overwrite_content = "Will overwrite the following file:"
overwrite_offset  = [ 0, 0, 50, 20 ]
overwrite_origin  = "center"
overwrite_title   = "Overwrite file?"

# quit
quit_content = "The following task is still running, are you sure you want to quit?"
quit_offset  = [ 0, 0, 50, 20 ]
quit_origin  = "center"
quit_title   = "Quit?"

# [select]
# open_title = "Open with:"
# open_origin = "hovered"
# open_offset = [0, 1, 50, 7]

[which]
sort_by        = "none"
sort_reverse   = false
sort_sensitive = false
sort_translit  = false

