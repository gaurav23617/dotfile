[manager]
cwd = { fg = "#94e2d5" }

hovered         = { bg = "#89b4fa", fg = "#1e1e2e" }
preview_hovered = { bg = "#cdd6f4", fg = "#1e1e2e" }

find_keyword  = { fg = "#f9e2af", italic = true }
find_position = { bg = "reset", fg = "#f5c2e7", italic = true }

marker_copied   = { bg = "#a6e3a1", fg = "#a6e3a1" }
marker_cut      = { bg = "#f38ba8", fg = "#f38ba8" }
marker_marked   = { bg = "#94e2d5", fg = "#94e2d5" }
marker_selected = { bg = "#89b4fa", fg = "#89b4fa" }

tab_active   = { bg = "#cdd6f4", fg = "#1e1e2e" }
tab_inactive = { bg = "#45475a", fg = "#cdd6f4" }
tab_width    = 1

count_copied   = { bg = "#a6e3a1", fg = "#1e1e2e" }
count_cut      = { bg = "#f38ba8", fg = "#1e1e2e" }
count_selected = { bg = "#89b4fa", fg = "#1e1e2e" }

border_style  = { fg = "#7f849c" }
border_symbol = "│"

syntect_theme = "~/.config/yazi/Catppuccin-mocha.tmTheme"

[mode]
normal_alt  = { bg = "#313244", fg = "#89b4fa" }
normal_main = { bg = "#89b4fa", bold = true, fg = "#1e1e2e" }

select_alt  = { bg = "#313244", fg = "#a6e3a1" }
select_main = { bg = "#a6e3a1", bold = true, fg = "#1e1e2e" }

unset_alt  = { bg = "#313244", fg = "#f2cdcd" }
unset_main = { bg = "#f2cdcd", bold = true, fg = "#1e1e2e" }

[status]
separator_close = ""
separator_open  = ""

progress_error  = { bg = "#45475a", fg = "#f38ba8" }
progress_label  = { bold = true, fg = "#ffffff" }
progress_normal = { bg = "#45475a", fg = "#89b4fa" }

perm_exec  = { fg = "#a6e3a1" }
perm_read  = { fg = "#f9e2af" }
perm_sep   = { fg = "#7f849c" }
perm_type  = { fg = "#89b4fa" }
perm_write = { fg = "#f38ba8" }

[input]
border   = { fg = "#89b4fa" }
selected = { reversed = true }
title    = {}
value    = {}

[pick]
active   = { fg = "#f5c2e7" }
border   = { fg = "#89b4fa" }
inactive = {}

[confirm]
border  = { fg = "#89b4fa" }
btn_no  = {}
btn_yes = { reversed = true }
content = {}
list    = {}
title   = { fg = "#89b4fa" }

[completion]
border = { fg = "#89b4fa" }

[tasks]
border  = { fg = "#89b4fa" }
hovered = { underline = true }
title   = {}

[which]
cand            = { fg = "#94e2d5" }
desc            = { fg = "#f5c2e7" }
mask            = { bg = "#313244" }
rest            = { fg = "#9399b2" }
separator       = "  "
separator_style = { fg = "#585b70" }

[help]
desc    = { fg = "#9399b2" }
footer  = { bg = "#45475a", fg = "#cdd6f4" }
hovered = { bg = "#585b70", bold = true }
on      = { fg = "#94e2d5" }
run     = { fg = "#f5c2e7" }

[notify]
title_error = { fg = "#f38ba8" }
title_info  = { fg = "#94e2d5" }
title_warn  = { fg = "#f9e2af" }

[filetype]
rules = [
  # Media
  { fg = "#94e2d5", mime = "image/*" },
  { fg = "#f9e2af", mime = "{audio,video}/*" },

  # Archives
  { fg = "#f5c2e7", mime = "application/*zip" },
  { fg = "#f5c2e7", mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}" },

  # Documents
  { fg = "#a6e3a1", mime = "application/{pdf,doc,rtf}" },

  # Fallback
  { fg = "#cdd6f4", name = "*" },
  { fg = "#89b4fa", name = "*/" },
]

