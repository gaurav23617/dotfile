esc_quit = true
mode     = "station"
switch   = "r"

[device]
infos        = "i"
toggle_power = "o"

[access_point]
start = 'n'
stop  = 'x'

[station]
toggle_scanning = "s"

[station.known_network]
remove             = "d"
share              = "p"
show_all           = "a"
toggle_autoconnect = "t"

[station.new_network]
connect_hidden = "h"
show_all       = "a"
